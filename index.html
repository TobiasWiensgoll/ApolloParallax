<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <audio id="audioLiftOff" src="Sound/apollo11_lift_off_final.mp3" preload="auto"></audio>
    <audio id="audioMission" src="Sound/Lunar_Descent_-_From_the_soundtrack_to__NASA_Explorers_Apollo_.mp3" preload="auto"></audio>
    <link rel="stylesheet" href="CSS/main.css" />
    <title>ApolloMission</title><script
    src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous"
    ></script>
</head>
<body>
    <main class="ContentContainer">
        <section class="background background-9">
            <div class="ParallaxContainer"><img /></div>
        </section>
        <section class="background background-8">
            <div class="ParallaxContainer moonContainer">
                <img class="moon" src="/Images/Mond png.png" />
            </div>
        </section>
        <section class="background background-7">
            <div class="ParallaxContainer">
              <img />
            </div>
        </section>
        <section class="background background-6">
            <div class="ParallaxContainer">
                <video class="meteor" 
                autoplay 
                loop 
                muted 
                playsinline 
                src="/Images/Meteor_GIF.mp4"></video>
            </div>
        </section>
        <section class="background background-5">
            <div class="ParallaxContainer">
                <img class="satellite" src="/Images/Satellit.png" />
            </div>
        </section>
        <section class="background background-4">
            <div class="ParallaxContainer">
                <video class="ShootingStar" 
                autoplay
                loop 
                muted 
                playsinline 
                src="/Images/Sternschnuppe.mp4"></video>
            </div>
        </section>
        <section class="background background-3">
            <div class="ParallaxContainer">
                <img class="airplane" src="/Images/Flugzeug.png" />
                <img class="clouds-2" src="/Images/wolken2.png" />
            </div>
        </section>
        <section class="background background-2">
            <div class="ParallaxContainer">
                <img class="clouds-1" src="/Images/wolken.png" />
                <img class="baloon" src="/Images/Ballon.png" />
            </div>
        </section>
        <section class="background background-1">
            <div class="RocketContainer">
                <img class="rocket" src="/Images/Rakete.png" />
            </div>
            <div class="ParallaxContainer">
                <img class="mountain" src="/Images/mountains.png" />
            </div>
        </section>
    </main>
    <div class="volume-control">
        <label for="volumeSlider">Volume: </label>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
    </div>
    <script src="JavaScript/index.js"></script>
</body>
</html>
