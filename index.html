<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <audio
      id="audioLiftOff"
      src="Sound/apollo11_lift_off_final.mp3"
      preload="auto"
    ></audio>
    <audio
      id="audioMission"
      src="Sound/Lunar_Descent_-_From_the_soundtrack_to__NASA_Explorers_Apollo_.mp3"
      preload="auto"
    ></audio>
    <link rel="stylesheet" href="CSS/main.css" />
    <link rel="stylesheet" href="CSS/Scene3.css" />
    <link rel="stylesheet" href="CSS/navbar.css" />
    <title>ApolloMission</title>
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="fixed">
      <header>
        <img src="Bilder/logo1.png" alt="Logo" />
        <h1><a id="anfang">MondMission: Apollo 11</a></h1>

        <nav>
          <ul class="nav">
            <li><a href="main.html">Szene1</a></li>
            <li><a href="#angebote">Szene2</a></li>
            <li><a href="#aboutus">Szene3</a></li>
            <li><a href="form.html">About Us</a></li>
          </ul>
        </nav>
      </header>
    </div>
    <main class="ContentContainer">
      <section class="background background-8">
        <div class="ParallaxContainer moonContainer">
          <img class="moon" src="/Images/Mond png.png" />
        </div>
      </section>
      <section class="background background-7">
        <div class="ParallaxContainer">
          <img />
        </div>
      </section>
      <section class="background background-6">
        <div class="ParallaxContainer">
          <video
            class="meteor"
            autoplay
            loop
            muted
            playsinline
            src="/Images/Meteor_GIF.mp4"
          ></video>
        </div>
      </section>
      <section class="background background-5">
        <div class="ParallaxContainer">
          <img class="satellite" src="/Images/Satellit.png" />
        </div>
      </section>
      <section class="background background-4">
        <div class="ParallaxContainer">
          <video
            class="ShootingStar"
            autoplay
            loop
            muted
            playsinline
            src="/Images/Sternschnuppe.mp4"
          ></video>
        </div>
      </section>
      <section class="background background-3">
        <div class="ParallaxContainer">
          <img class="airplane" src="/Images/Flugzeug.png" />
          <img class="clouds-2" src="/Images/wolken2.png" />
        </div>
      </section>
      <section class="background background-2">
        <div class="ParallaxContainer">
          <img class="clouds-1" src="/Images/wolken.png" />
          <img class="baloon" src="/Images/Ballon.png" />
        </div>
      </section>
      <section class="background background-1">
        <div class="RocketContainer">
          <img class="Flame flameStart hidden" src="/Images/Flamme_Start.gif" />

          <img class="Flame nurFlamme hidden" src="/Images/NurFlamme.gif" />
          <img class="rocket" src="/Images/Rakete.png" />
        </div>
        <div class="ParallaxContainer">
          <img class="mountain" src="/Images/mountains.png" />
        </div>
      </section>
    </main>
    <div class="Scene3">
      <div class="container">
        <div class="wrapper">
          <div class="slide">
            <div class="layer rocket2">
              <img src="/Images/Rakete.png" />
            </div>
            <div class="layer l1">
              <img src="/Images/Astronaut1.png" />
              <img src="/Images/Astronaut2.png" />
              <img src="/Images/Astronaut3.png" />
            </div>
            <div class="layer moonLeft">
              <img src="/Images/Mond png.png" />
            </div>
          </div>
          <div class="slide">
            <div class="layer l2">
              <img class="Alien animate-on-scroll" src="/Images/Alien.png" />
            </div>
            <div class="layer l2">
              <img class="Flagge" src="/Images/Flagge.png" />
            </div>
            <div class="layer moonRight">
              <img src="/Images/Mond png.png" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="volume-control">
      <label for="volumeSlider">Volume: </label>
      <input
        type="range"
        id="volumeSlider"
        min="0"
        max="1"
        step="0.01"
        value="0.5"
      />
    </div>
    <script src="JavaScript/index.js"></script>
    <script src="JavaScript/HorizontalParallax.js"></script>
    <script src="/JavaScript/transition.js"></script>
    <script src="/JavaScript/flamme.js"></script>
    <script src="/JavaScript/navbar.js"></script>
  </body>
</html>
