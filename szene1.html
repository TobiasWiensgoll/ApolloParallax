<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apollo 11: Startszene</title>
    <link rel="stylesheet" href="/CSS/scene1.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/gsap.min.js"></script>
  </head>
  <body>  
      <div class="menu">
        <div class="menu--wrapper">
          
          <!--1. Bubble: Introduction-->
          <div class="menu--item">
            <figure>
              <div class="speech-bubble2 round">
                Am <i>16. Juli 1969</i>         <br> 
                versammelten sich Millionen weltweit vor ihren Fernsehern,
                als die <b>Saturn V-Rakete</b>  <br>
                auf der Startrampe 39A          <br>
                des Kennedy Space Centers       <br> 
                in Florida stand.               <br><br>
                Die <b>Apollo 11 Mission</b> begann ihre Reise zum Mond.
              </div>
            </figure>
          </div>

          
          <!--2. Bubble: Astronauten-->
          <div class="menu--item">
            <figure>
              <div class="speech-bubble2 round">
                An Bord der Rakete:<br><br>
                <b>Neil Armstrong</b>:<br>
                Kommandant der Mission<br><br>
                <b>Buzz Aldrin</b>:<br>
                Pilot des Lunar Modules<br><br>
                <b>Michael Collins</b><br>
                Pilot des Kommandomoduls
              </div>
            </figure>
          </div>


          <!--3. Bubble: 30 Minuten vor Start-->
          <div class="menu--item">
            <figure>
              <div class="speech-bubble2 round">
                Die Countdown-Uhr tickte unaufhaltsam herunter,       <br> 
                während Ingenieure die letzten Systeme überprüften.   <br><br>
                Aus der Missionskontrolle erklang die Stimme: <br>
                <i>"<b>T-minus 30 Minuten</b> und alle Systeme sind grün."</i>
              </div>
            </figure>
          </div>

          <!--4. Bubble: Kurz vor Start-->
          <div class="menu--item">
            <figure>
              <div class="speech-bubble2 round">
                Die Zeit schien still zu stehen, als die Astronauten in der
                Kommandokapsel saßen und aufgeregt auf den
                bevorstehenden Start warteten.<br><br>
                Die Triebwerke waren aufgeladen,die Systeme intakt. <br><br>
                <i>Doch noch war es nicht soweit.</i>
              </div>
            </figure>
          </div>

          <!--5. Bubble: Zündung-->
          <div class="menu--item">
            <figure>
              <div class="speech-bubble2 round">
                <i>"In  10... 9... 8... 7... <br>
                6... 5... 4... 3... 2... 1...<br>
                <b>Zündung!</b>",</i>
                hallte die <br>Stimme der Missionskontrolle.<br><br>
                Die gewaltigen Triebwerke der Saturn V-Rakete entfesselten ihre Energie 
                und mit einem ohrenbetäubenden Donnern begann die Reise. <br>
              </div>
            </figure>
          </div>

          <!--6. Bubble: Hinweis Startbutton-->
          <div class="menu--item">
            <figure>
              <div class="speech-bubble2 round">
                Das Ziel der Mission:<br>
                <b>Die erste Reise zum Mond!</b><br><br>
                <i>
                  Um der Rakete auf ihrer Reise in die unerforschten Tiefen des Weltraums zu folgen<br>
                  und mehr faszinierende Fakten über dieses Thema zu erfahren:<br><br>
                  Klicke auf den <b>Start-Button</b>
                </i>
              </div>
            </figure>
          </div>


          <!-- 7. STARTBUTTON-->
          <div class="menu--item">
              <figure>
                <div class="speech-bubble2 round" id="button">
                  <a href="index.html" class="link"><img src="Images/Startbutton.png"></a>
                </div>
              </figure>
          </div>


        </div> <!-- Ende Menu-wrapper-->
      </div> <!-- Ende Menu-->
    
    <script src="/JavaScript/slider.js"></script>
  </body>
</html>
